<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Office - Model Health Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      background: #0a0e14;
      color: #e6e6e6;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 {
      color: #4ecdc4;
      font-size: 24px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle { color: #6c757d; font-size: 12px; margin-bottom: 24px; }
    .summary {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }
    .summary-card {
      background: #1a1f2e;
      border: 1px solid #2a3040;
      border-radius: 8px;
      padding: 16px 24px;
      text-align: center;
    }
    .summary-card .count {
      font-size: 32px;
      font-weight: bold;
    }
    .summary-card .label {
      font-size: 11px;
      color: #6c757d;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .online .count { color: #20c997; }
    .lagging .count { color: #ffc107; }
    .offline .count { color: #dc3545; }
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .model-card {
      background: #1a1f2e;
      border: 1px solid #2a3040;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .model-card.online { border-left: 3px solid #20c997; }
    .model-card.lagging { border-left: 3px solid #ffc107; }
    .model-card.offline { border-left: 3px solid #dc3545; }
    .indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .indicator.online {
      background: #20c997;
      box-shadow: 0 0 8px #20c99780;
    }
    .indicator.lagging {
      background: #ffc107;
      box-shadow: 0 0 8px #ffc10780;
    }
    .indicator.offline {
      background: #dc3545;
      box-shadow: 0 0 8px #dc354580;
    }
    .model-info { flex: 1; }
    .model-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    .model-provider {
      font-size: 11px;
      color: #6c757d;
      text-transform: uppercase;
    }
    .model-latency {
      font-size: 11px;
      color: #4ecdc4;
      text-align: right;
    }
    .refresh-btn {
      background: #2a3548;
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 20px;
    }
    .refresh-btn:hover { background: #3a4558; }
    .error-msg {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid #dc3545;
      border-radius: 4px;
      padding: 12px;
      color: #dc3545;
      font-size: 12px;
    }
    .loading { color: #6c757d; text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Model Health Dashboard</h1>
    <div class="subtitle">Pixel Office - Real-time status at <span id="timestamp">-</span></div>
    
    <div class="summary">
      <div class="summary-card online">
        <div class="count" id="online-count">-</div>
        <div class="label">Online</div>
      </div>
      <div class="summary-card lagging">
        <div class="count" id="lagging-count">-</div>
        <div class="label">Lagging</div>
      </div>
      <div class="summary-card offline">
        <div class="count" id="offline-count">-</div>
        <div class="label">Offline</div>
      </div>
    </div>
    
    <div id="models-container" class="models-grid">
      <div class="loading">Loading models...</div>
    </div>
    
    <button class="refresh-btn" onclick="fetchModels()">🔄 Refresh</button>
  </div>

  <script>
    async function fetchModels() {
      const container = document.getElementById('models-container');
      container.innerHTML = '<div class="loading">Checking models...</div>';
      
      try {
        const res = await fetch('/api/models/health');
        const data = await res.json();
        
        document.getElementById('timestamp').textContent = new Date(data.timestamp).toLocaleString();
        document.getElementById('online-count').textContent = data.summary.online;
        document.getElementById('lagging-count').textContent = data.summary.lagging;
        document.getElementById('offline-count').textContent = data.summary.offline;
        
        container.innerHTML = data.models.map(m => `
          <div class="model-card ${m.status}">
            <div class="indicator ${m.status}"></div>
            <div class="model-info">
              <div class="model-name">${m.name}</div>
              <div class="model-provider">${m.provider}</div>
              ${m.error ? `<div style="color:#dc3545;font-size:10px;margin-top:4px">${m.error}</div>` : ''}
            </div>
            <div class="model-latency">${m.latency ? m.latency + 'ms' : ''}</div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<div class="error-msg">Failed to load: ${e.message}</div>`;
      }
    }
    
    fetchModels();
    setInterval(fetchModels, 30000);
  </script>
</body>
</html>
